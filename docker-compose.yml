services:
  db:
    image: postgres:16
    container_name: streetfood-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudflare-net
  app:
    build: .
    container_name: streetfood-app
    restart: always
    depends_on:
      - db
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway" #το NOC,δηλαδη μεσα στο .env NOC_BASE_URL=http://host.docker.internal:8081
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
    networks:
      - cloudflare-net
  nginx:
    image: nginx:stable-alpine
    container_name: streetfood-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" #το NOC,δηλαδη μεσα στο .env NOC_BASE_URL=http://host.docker.internal:8081
    depends_on:
      - app
    networks:
      - cloudflare-net
  #  tunnel:
  #   image: cloudflare/cloudflared:latest
  #  container_name: cloudflare-tunnel
  #  restart: always
  #  environment:
  #    - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #  command: tunnel --no-autoupdate run
  #  extra_hosts:
  #    - "host.docker.internal:host-gateway"
  #  depends_on:
  #    - nginx

volumes:
  postgres_data:
networks:
  cloudflare-net:
    external: true
