
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Stores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f6f8fb;
            color: #1f2937;
        }
        .hero {
            background: linear-gradient(135deg, #ff4d4f, #ff7a45);
            border-radius: 20px;
            color: #fff;
        }
        .store-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.08);
            transition: transform .2s ease, box-shadow .2s ease;
            overflow: hidden;
        }
        .store-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(17, 24, 39, 0.14);
        }
        .store-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .store-closed {
            opacity: .55;
            filter: grayscale(30%);
            pointer-events: none;
        }
        .pill {
            border-radius: 999px;
            font-size: .75rem;
        }
    </style>
</head>
<body>
<div class="container py-4 py-md-5">
    <div class="hero p-4 p-md-5 mb-4">
        <h1 class="fw-bold mb-2">Discover stores κοντά σου</h1>
        <p class="mb-0">Επίλεξε κατάστημα, τσέκαρε μενού και ξεκίνα παραγγελία σε δευτερόλεπτα.</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
            <form method="post" th:action="@{/showstores}" class="row g-2 align-items-end">
                <div class="col-12 col-md-6 col-lg-4">
                    <label for="storeType" class="form-label fw-semibold">Filter by Type</label>
                    <select id="storeType" name="stores" class="form-select rounded-3" required>
                        <option value="">-- Select a type --</option>
                        <option value="GYROS">Gyros</option>
                        <option value="BURGER">Burger</option>
                        <option value="PIZZA">Pizza</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-danger rounded-3 px-4">Filter</button>
                </div>
                <div class="col-auto">
                    <a href="/showstores" class="btn btn-outline-secondary rounded-3 px-4">Clear</a>
                </div>
            </form>
        </div>
    </div>

    <div class="row g-3">
        <div th:each="store : ${stores}" class="col-12 col-md-6 col-lg-4">
            <div class="store-card card h-100" th:classappend="${store.open == false} ? 'store-closed' : ''">
                <a class="store-link h-100" th:href="@{'/store/' + ${store.id} + '/createorder'}">
                    <div class="card-body d-flex flex-column gap-2">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h5 class="fw-bold mb-0" th:text="${store.storeName}">Store Name</h5>
                            <span class="badge text-bg-light border pill" th:text="${store.open ? 'Open' : 'Closed'}">Open</span>
                        </div>
                        <p class="mb-0 small text-secondary"><strong>Address:</strong> <span th:text="${store.storeAddress}"></span></p>
                        <p class="mb-0 small text-secondary"><strong>Type:</strong> <span th:text="${store.storeType}"></span></p>
                        <p class="mb-0 small text-secondary"><strong>Phone:</strong> <span th:text="${store.phoneNumber}"></span></p>
                        <p class="mb-0 small fw-semibold text-success"><strong>Min Delivery:</strong> €<span th:text="${store.minOrder}"></span></p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="/profile" class="btn btn-outline-dark rounded-3">Back to Profile</a>
    </div>
</div>
</body>
</html>
