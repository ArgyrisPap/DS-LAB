<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f8fb; }
        .order-shell {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(17, 24, 39, 0.08);
        }
        .price { color: #16a34a; font-weight: 700; }
        .table thead th { white-space: nowrap; }
        .qty-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid #dee2e6;
            border-radius: .75rem;
            overflow: hidden;
            background: #fff;
        }
        .qty-btn {
            border: 0;
            background: #f8f9fa;
            width: 36px;
            height: 36px;
            font-weight: 700;
            color: #495057;
            line-height: 1;
        }
        .qty-btn:hover { background: #e9ecef; }
        .qty-input {
            width: 54px;
            text-align: center;
            border: 0;
            border-left: 1px solid #dee2e6;
            border-right: 1px solid #dee2e6;
            border-radius: 0;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
<div class="container py-4 py-md-5">
    <div class="card order-shell mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1" th:text="${store.storeName}">Store Name</h2>
                    <p class="text-secondary mb-0" th:if="${store.storeAddress}" th:text="'Address: ' + ${store.storeAddress}">Address</p>
                </div>
                <span class="badge text-bg-light border rounded-pill px-3 py-2" th:text="'Min Delivery: €' + ${store.minOrder}">Min Delivery</span>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h1 class="h3 fw-bold mb-0">Create Your Order</h1>
        <a href="/showstores" class="btn btn-outline-dark rounded-3">Back to Stores</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger rounded-4" th:text="${errorMessage}"></div>

    <form th:action="@{'/store/' + ${store.id} + '/createorder'}" method="post" th:object="${orderFormRequest}" class="card order-shell">
        <div class="card-body">
            <input type="hidden" th:field="*{storeId}" />
            <input type="hidden" th:field="*{editOrderId}" />

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Item</th>
                        <th>Description</th>
                        <th>Price</th>
                        <th>Quantity</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, iterStat : ${menuItems}">
                        <td th:text="${item.description != null ? item.description : 'Item ' + (iterStat.index + 1)}">Item Name</td>
                        <td class="text-secondary" th:text="${item.description}">Description</td>
                        <td class="price" th:text="'€' + ${#numbers.formatDecimal(item.price, 1, 2)}">€0.00</td>
                        <td>
                            <input type="hidden" name="foodItemIds" th:value="${item.id}" />
                            <div class="qty-control">
                                <button type="button" class="qty-btn js-decrement">−</button>

                                <input type="number"
                                       name="quantities"
                                       th:data-price="${item.price}"
                                       min="0" max="99" value="0"
                                       class="form-control qty-input"
                                       th:attr="data-item-id=${item.id}" />

                                <button type="button" class="qty-btn js-increment">+</button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <div class="card bg-light border-0 rounded-4 p-3" style="min-width: 200px;">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-secondary">Σύνολο:</span>
                        <span id="grand-total" class="h4 fw-bold mb-0 text-success">€0.00</span>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-3">
                <select name="type" required class="form-select rounded-3" style="max-width: 220px;">
                    <option value="TAKE_AWAY">Take Away</option>
                    <option value="DELIVERY" selected>Delivery</option>
                </select>
                <button type="submit" class="btn btn-danger rounded-3 px-4">Submit Order</button>
            </div>
        </div>
    </form>
</div>
<script>
    const grandTotalDisplay = document.getElementById('grand-total');

    function updateTotal() {
        let total = 0;
        // Επιλέγουμε όλα τα input ποσότητας
        document.querySelectorAll('.qty-input').forEach(input => {
            const qty = Number(input.value || 0);
            const price = Number(input.dataset.price || 0);
            total += qty * price;
        });

        // Ενημέρωση του κειμένου με 2 δεκαδικά
        grandTotalDisplay.innerText = '€' + total.toFixed(2);
    }

    document.querySelectorAll('.qty-control').forEach((control) => {
        const input = control.querySelector('.qty-input');
        const min = Number(input.min || 0);
        const max = Number(input.max || 99);

        control.querySelector('.js-decrement').addEventListener('click', () => {
            const value = Number(input.value || 0);
            if (value > min) {
                input.value = value - 1;
                updateTotal(); // <--- Ενημέρωση εδώ
            }
        });

        control.querySelector('.js-increment').addEventListener('click', () => {
            const value = Number(input.value || 0);
            if (value < max) {
                input.value = value + 1;
                updateTotal(); // <--- Ενημέρωση εδώ
            }
        });

        // Αν ο χρήστης πληκτρολογήσει απευθείας νούμερο
        input.addEventListener('change', updateTotal);
    });
    updateTotal();
</script>
</body>
</html>
